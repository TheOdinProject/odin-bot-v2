# Local dev stack: Postgres + Redis + the bot.
#   cp .env.sample .env   # fill in the DISCORD_* values
#   docker compose up     # or: podman compose up
#   docker compose run --rm test
x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    # Override the host-oriented values in .env so the app talks to the compose services.
    # dbmate requires SSL unless sslmode=disable is set.
    DATABASE_URL: postgresql://odinbot:odinbot@postgres:5432/odinbot_development?sslmode=disable
    TEST_DATABASE_URL: postgresql://odinbot:odinbot@postgres:5432/odinbot_test?sslmode=disable
    REDIS_URL: redis://redis:6379
  volumes:
    - .:/app
    # keep the Linux node_modules from the image instead of the host's
    - /app/node_modules

services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: odinbot
      POSTGRES_PASSWORD: odinbot
      POSTGRES_DB: odinbot_development
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U odinbot -d odinbot_development']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Mirrors the Procfile release step; the bot refuses to start with pending migrations
  migrate:
    <<: *app
    command: ['npm', 'run', 'migrate:only']
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *app
    command: ['npm', 'run', 'dev']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Mirrors .github/workflows/test.yml. Run with: docker compose run --rm test
  test:
    <<: *app
    # dbmate up creates odinbot_test if it doesn't exist yet; the test setup expects it to be there
    command:
      [
        'sh',
        '-c',
        'npx dbmate --env=TEST_DATABASE_URL --no-dump-schema up && npm test',
      ]
    profiles: ['test']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
